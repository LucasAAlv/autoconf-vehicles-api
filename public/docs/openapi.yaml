    patch:
      summary: 'Set the cover of a vehicle to one of its own images.'
      operationId: setTheCoverOfAVehicleToOneOfItsOwnImages
      description: "`{imageId}` is resolved manually (`vehicle_id`-scoped query +\n`findOrFail`) instead of via implicit nested route-model binding:\nnested binding would need `{vehicle}` and `{image}` to be related\nthrough a named Eloquent relationship matching the route segment,\nwhereas here the check that the image actually belongs to this\nvehicle *is* the interesting behaviour (an image from a different\nvehicle must 404, not 403), so it is spelled out explicitly.\n`findOrFail` throws a `ModelNotFoundException`, which the exception\nhandler in `bootstrap/app.php` already rewrites into a 404\n`application/problem+json` response — nothing extra to do here for\neither \"wrong vehicle\" or \"no such image\"."
      parameters: []
      responses:
        200:
          description: 'Imagem promovida a capa. Qualquer imagem anteriormente marcada como capa deste veículo deixa de sê-lo, de forma transacional.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 36
                    path: vehicles/760/6b72fe4a-5b40-307c-bc24-f79acf9a1bb9.jpg
                    url: 'http://localhost:8000/storage/vehicles/760/6b72fe4a-5b40-307c-bc24-f79acf9a1bb9.jpg'
                    is_cover: false
                    created_at: '2026-08-06T22:24:39.000000Z'
                    updated_at: '2026-08-06T22:24:39.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 36
                      path:
                        type: string
                        example: vehicles/760/6b72fe4a-5b40-307c-bc24-f79acf9a1bb9.jpg
                      url:
                        type: string
                        example: 'http://localhost:8000/storage/vehicles/760/6b72fe4a-5b40-307c-bc24-f79acf9a1bb9.jpg'
                      is_cover:
                        type: boolean
                        example: false
                      created_at:
                        type: string
                        example: '2026-08-06T22:24:39.000000Z'
                      updated_at:
                        type: string
                        example: '2026-08-06T22:24:39.000000Z'
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: Forbidden
                  status: 403
                  detail: 'This action is unauthorized.'
                  instance: /api/vehicles/1/images/1/cover
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: 'This action is unauthorized.'
                  instance:
                    type: string
                    example: /api/vehicles/1/images/1/cover
        404:
          description: 'Também retornado quando a imagem existe mas pertence a outro veículo.'
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: 'Not Found'
                  status: 404
                  detail: 'The requested resource was not found.'
                  instance: /api/vehicles/1/images/999/cover
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: 'Not Found'
                  status:
                    type: integer
                    example: 404
                  detail:
                    type: string
                    example: 'The requested resource was not found.'
                  instance:
                    type: string
                    example: /api/vehicles/1/images/999/cover
      tags:
        - Images
    parameters:
      -
        in: path
        name: vehicle_id
        description: 'Id do veículo.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: imageId
        description: 'Id da imagem (deve pertencer ao veículo informado).'
        example: 1
        required: true
        schema:
          type: integer
  '/api/vehicles/{vehicle_id}/images/{imageId}':
    delete:
      summary: 'Delete a single image belonging to a vehicle.'
      operationId: deleteASingleImageBelongingToAVehicle
      description: "The image is looked up through `$vehicle->images()` rather than a\nglobal `VehicleImage::findOrFail()` (or implicit route-model binding\non `{imageId}`): this guarantees an image belonging to a different\nvehicle 404s exactly like one that doesn't exist at all, instead of\nleaking a 403 (or succeeding) for an id that is real but not \"this\nvehicle's\"."
      parameters: []
      responses:
        204:
          description: 'Imagem excluída do banco e o arquivo físico removido do storage.'
          content:
            text/plain:
              schema:
                type: string
                example: ''
        403:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: Forbidden
                  status: 403
                  detail: 'This action is unauthorized.'
                  instance: /api/vehicles/1/images/1
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: Forbidden
                  status:
                    type: integer
                    example: 403
                  detail:
                    type: string
                    example: 'This action is unauthorized.'
                  instance:
                    type: string
                    example: /api/vehicles/1/images/1
        404:
          description: 'Também retornado quando a imagem existe mas pertence a outro veículo.'
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: 'Not Found'
                  status: 404
                  detail: 'The requested resource was not found.'
                  instance: /api/vehicles/1/images/999
                properties:
                  type:
