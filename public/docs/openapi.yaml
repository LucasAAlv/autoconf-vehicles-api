      summary: 'Delete a vehicle.'
      operationId: deleteAVehicle
      description: "`vehicle_images.vehicle_id` is `cascadeOnDelete()` at the raw\nPostgreSQL level, so `VehicleImage` rows disappear automatically along\nwith the vehicle — but that cascade never fires an Eloquent event, so\n`VehicleImageService::deleteAllForVehicle()` is called, inside the same\ntransaction, to also clean up the physical files from the public disk\n(deferred to after the commit, so a rollback never leaves the vehicle\ngone but its images' files still on disk, or vice versa)."
      parameters: []
      responses:
        204:
          description: 'Veículo (e suas imagens, no banco e no storage) excluído com sucesso.'
          content:
            text/plain:
              schema:
                type: string
                example: ''
