openapi: 3.0.3
info:
  title: 'Autoconf Vehicles API Documentation'
  description: 'API para um SaaS multiusuário de gestão de veículos: autenticação, cadastro de veículos e gestão de imagens com capa única.'
  version: 1.0.0
servers:
  - url: 'http://localhost:8000'
tags:
  - name: Auth
    description: "Registration, login, logout and the current authenticated user. This API is a\n**Sanctum SPA**: a successful `login` (or `register` followed by `login`) sets an\n`HttpOnly` session cookie, and every subsequent authenticated request must carry a\nvalid `X-XSRF-TOKEN` header sourced from the `XSRF-TOKEN` cookie handed out by\n`GET /sanctum/csrf-cookie` — see the \"Authentication\" section above."
  - name: Vehicles
    description: 'CRUD de veículos. Qualquer usuário autenticado pode listar/visualizar qualquer veículo; apenas o dono (`user_id`) ou um usuário `is_admin` pode atualizar ou excluir.'
  - name: Images
    description: 'Upload e gestão de imagens de um veículo, incluindo a capa única (`is_cover`). Assim como `update`/`delete` de veículos, apenas o dono do veículo ou um usuário `is_admin` pode gerenciar suas imagens.'
paths:
  /api/auth/register:
    post:
      summary: 'Create a new user account.'
      operationId: createANewUserAccount
      description: "This does not also start an authenticated session: registration and\nlogin are kept as two separate, explicit steps, matching the plain\n`POST /auth/register` contract this endpoint promises. `User::create()`\nonly ever receives the request's own validated fields, so a payload\nthat also sends `is_admin` (or any other attribute) has no way to\ninfluence the created record."
      parameters: []
      responses:
        201:
          description: 'Conta criada com sucesso. Note que isso não autentica o usuário — é necessário chamar `POST /auth/login` em seguida.'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Maria Souza'
                  email: maria.souza@example.com
                  created_at: '2026-08-06T12:00:00.000000Z'
                  updated_at: '2026-08-06T12:00:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Maria Souza'
                  email:
                    type: string
                    example: maria.souza@example.com
                  created_at:
                    type: string
                    example: '2026-08-06T12:00:00.000000Z'
                  updated_at:
                    type: string
                    example: '2026-08-06T12:00:00.000000Z'
        422:
          description: 'Payload inválido — e-mail já cadastrado, senha e confirmação não coincidem, ou campo obrigatório ausente.'
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: 'Unprocessable Content'
                  status: 422
                  detail: 'The email has already been taken. (and 1 more error)'
                  instance: /api/auth/register
                  errors:
                    email:
                      - 'The email has already been taken.'
                    password:
                      - 'The password field confirmation does not match.'
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: 'Unprocessable Content'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'The email has already been taken. (and 1 more error)'
                  instance:
                    type: string
                    example: /api/auth/register
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'The email has already been taken.'
                        items:
                          type: string
                      password:
                        type: array
                        example:
                          - 'The password field confirmation does not match.'
                        items:
                          type: string
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Nome completo do usuário.'
                  example: 'Maria Souza'
                email:
                  type: string
                  description: 'E-mail único do usuário.'
                  example: maria.souza@example.com
                password:
                  type: string
                  description: 'Senha do usuário, sujeita às regras padrão de senha do Laravel.'
                  example: Str0ng!Passw0rd
                password_confirmation:
                  type: string
                  description: 'Deve ser idêntica a `password`.'
                  example: Str0ng!Passw0rd
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/login:
    post:
      summary: "Authenticate a user for the SPA's stateful (cookie) session."
      operationId: authenticateAUserForTheSPAsStatefulcookieSession
      description: "`ValidationException::withMessages()` on a bad attempt is deliberate,\nnot just convenient: this app's exception renderer already turns any\n`ValidationException` into the same `application/problem+json` 422\nenvelope used by Form Request validation, so a credentials failure\nlooks identical to any other validation failure to API consumers\nwithout the controller having to build that response by hand."
      parameters: []
      responses:
        200:
          description: 'Login bem-sucedido. A resposta carrega o cookie de sessão `HttpOnly`; o corpo é o usuário autenticado.'
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Maria Souza'
                  email: maria.souza@example.com
                  created_at: '2026-08-06T12:00:00.000000Z'
                  updated_at: '2026-08-06T12:00:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Maria Souza'
                  email:
                    type: string
                    example: maria.souza@example.com
                  created_at:
                    type: string
                    example: '2026-08-06T12:00:00.000000Z'
                  updated_at:
                    type: string
                    example: '2026-08-06T12:00:00.000000Z'
        422:
          description: 'Credenciais inválidas. Mesmo formato `application/problem+json` usado por qualquer outra falha de validação (422).'
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: 'Unprocessable Content'
                  status: 422
                  detail: 'These credentials do not match our records.'
                  instance: /api/auth/login
                  errors:
                    email:
                      - 'These credentials do not match our records.'
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: 'Unprocessable Content'
                  status:
                    type: integer
                    example: 422
                  detail:
                    type: string
                    example: 'These credentials do not match our records.'
                  instance:
                    type: string
                    example: /api/auth/login
                  errors:
                    type: object
                    properties:
                      email:
                        type: array
                        example:
                          - 'These credentials do not match our records.'
                        items:
                          type: string
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'E-mail cadastrado.'
                  example: maria.souza@example.com
                password:
                  type: string
                  description: 'Senha da conta.'
                  example: Str0ng!Passw0rd
              required:
                - email
                - password
      security: []
  /api/auth/me:
    get:
      summary: 'Return the currently authenticated user.'
      operationId: returnTheCurrentlyAuthenticatedUser
      description: "This route sits behind `auth:sanctum`, so a guest never reaches this\nmethod at all: Sanctum's own guard throws `AuthenticationException`\nfirst, which the app's exception renderer already turns into a\nproblem+json 401 (wired in `bootstrap/app.php`)."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 1
                  name: 'Maria Souza'
                  email: maria.souza@example.com
                  created_at: '2026-08-06T12:00:00.000000Z'
                  updated_at: '2026-08-06T12:00:00.000000Z'
                properties:
                  id:
                    type: integer
                    example: 1
                  name:
                    type: string
                    example: 'Maria Souza'
                  email:
                    type: string
                    example: maria.souza@example.com
                  created_at:
                    type: string
                    example: '2026-08-06T12:00:00.000000Z'
                  updated_at:
                    type: string
                    example: '2026-08-06T12:00:00.000000Z'
        401:
          description: 'Nenhuma sessão válida (cookie ausente/expirado, ou `X-XSRF-TOKEN` ausente/incorreto).'
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                  instance: /api/auth/me
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
                  instance:
                    type: string
                    example: /api/auth/me
      tags:
        - Auth
  /api/auth/logout:
    post:
      summary: "End the SPA's authenticated session."
      operationId: endTheSPAsAuthenticatedSession
      description: "The three steps mirror `login()`'s own care around sessions, in\nreverse: log the guard out, destroy the session data, and rotate the\nCSRF token, so neither the session id nor the CSRF token an attacker\nobserved before logout stays valid afterwards. `204 No Content` is\nused rather than `200` because there is no representation to return\nfor a logout."
      parameters: []
      responses:
        204:
          description: 'Sessão, dados de sessão e token CSRF invalidados com sucesso.'
          content:
            text/plain:
              schema:
                type: string
                example: ''
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                  instance: /api/auth/logout
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
                  instance:
                    type: string
                    example: /api/auth/logout
      tags:
        - Auth
  /api/vehicles:
    get:
      summary: 'List vehicles, paginated.'
      operationId: listVehiclesPaginated
      description: "`VehiclePolicy::viewAny` already allows any authenticated user, so\nthis lists every vehicle in the system, not just the caller's own —\nconsistent with `show()`, which likewise doesn't gate on ownership.\n\n`Vehicle::query()` is ordered by `id` (so pagination is deterministic)\nand paginated. `q`/`marca`/`modelo`/`placa` filtering is delegated to\n`Vehicle::scopeFilter()` (issue #30) so this method stays a thin\npass-through of the validated input; sorting (issue #31) extends this\nsame query rather than replacing it, via `Vehicle::scopeSort()`, and is\nchained *before* the trailing `orderBy('id')` so the requested fields\ntake precedence and `id` only breaks ties among rows equal on all of\nthem.\n\n`per_page` is clamped to `MAX_PER_PAGE` instead of erroring, so a\nclient asking for an unbounded page size just gets the cap back.\n`VehicleResource::collection()` on a paginator carries `total`,\n`current_page`, `last_page` and `per_page` through automatically in\nthe response's `meta` envelope, so no custom collection class is\nneeded to satisfy those fields.\n\nNote: unlike `show()`/`store()`/`update()`, this list view never eager-loads\n`creator`/`updater`/`images`, so those keys are absent from each item here —\nfetch `GET /vehicles/{vehicle}` for the full shape."
      parameters:
        -
          in: query
          name: q
          description: 'Busca livre (placa, chassi, marca, modelo ou versão).'
          example: Corolla
          required: false
          schema:
            type: string
            description: 'Busca livre (placa, chassi, marca, modelo ou versão).'
            example: Corolla
        -
          in: query
          name: marca
          description: 'Filtra por marca exata.'
          example: Toyota
          required: false
          schema:
            type: string
            description: 'Filtra por marca exata.'
            example: Toyota
        -
          in: query
          name: modelo
          description: 'Filtra por modelo exato.'
          example: Corolla
          required: false
          schema:
            type: string
            description: 'Filtra por modelo exato.'
            example: Corolla
        -
          in: query
          name: placa
          description: 'Filtra por placa exata.'
          example: ABC1D23
          required: false
          schema:
            type: string
            description: 'Filtra por placa exata.'
            example: ABC1D23
        -
          in: query
          name: sort
          description: 'Lista separada por vírgulas de campos ordenáveis (`km`, `valor_venda`, `marca`, `modelo`, `created_at`), cada um opcionalmente prefixado com `-` para ordem decrescente.'
          example: 'km,-valor_venda'
          required: false
          schema:
            type: string
            description: 'Lista separada por vírgulas de campos ordenáveis (`km`, `valor_venda`, `marca`, `modelo`, `created_at`), cada um opcionalmente prefixado com `-` para ordem decrescente.'
            example: 'km,-valor_venda'
        -
          in: query
          name: page
          description: 'Número da página (1-indexado).'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Número da página (1-indexado).'
            example: 1
        -
          in: query
          name: per_page
          description: 'Itens por página (padrão 15, máximo 100 — valores maiores são reduzidos ao limite).'
          example: 15
          required: false
          schema:
            type: integer
            description: 'Itens por página (padrão 15, máximo 100 — valores maiores são reduzidos ao limite).'
            example: 15
      responses:
        200:
          description: 'Página de veículos. `creator`/`updater`/`images` não são carregados nesta listagem.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 41
                      placa: NGZ0A00
                      chassi: MIYVDLJNIKH000000
                      marca: Chevrolet
                      modelo: Kicks
                      versao: '1.6 Turbo'
                      valor_venda: '152854.40'
                      cor: fuchsia
                      km: 208376
                      cambio: manual
                      combustivel: gasolina
                      user_id: 71
                      created_at: '2026-08-06T22:24:39.000000Z'
                      updated_at: '2026-08-06T22:24:39.000000Z'
                    -
                      id: 42
                      placa: SIT0A01
                      chassi: CPSCQLDZSNR000001
                      marca: Honda
                      modelo: Corolla
                      versao: Titanium
                      valor_venda: '174593.24'
                      cor: teal
                      km: 138484
                      cambio: automatico
                      combustivel: diesel
                      user_id: 72
                      created_at: '2026-08-06T22:24:39.000000Z'
                      updated_at: '2026-08-06T22:24:39.000000Z'
                  links:
                    first: '/?page=1'
                    last: '/?page=1'
                    prev: null
                    next: null
                  meta:
                    current_page: 1
                    from: 1
                    last_page: 1
                    links:
                      -
                        url: null
                        label: '&laquo; Previous'
                        page: null
                        active: false
                      -
                        url: '/?page=1'
                        label: '1'
                        page: 1
                        active: true
                      -
                        url: null
                        label: 'Next &raquo;'
                        page: null
                        active: false
                    path: /
                    per_page: 15
                    to: 2
                    total: 2
                properties:
                  data:
                    type: array
                    example:
                      - id: 41
                        placa: NGZ0A00
                        chassi: MIYVDLJNIKH000000
                        marca: Chevrolet
                        modelo: Kicks
                        versao: '1.6 Turbo'
                        valor_venda: '152854.40'
                        cor: fuchsia
                        km: 208376
                        cambio: manual
                        combustivel: gasolina
                        user_id: 71
                        created_at: '2026-08-06T22:24:39.000000Z'
                        updated_at: '2026-08-06T22:24:39.000000Z'
                      - id: 42
                        placa: SIT0A01
                        chassi: CPSCQLDZSNR000001
                        marca: Honda
                        modelo: Corolla
                        versao: Titanium
                        valor_venda: '174593.24'
                        cor: teal
                        km: 138484
                        cambio: automatico
                        combustivel: diesel
                        user_id: 72
                        created_at: '2026-08-06T22:24:39.000000Z'
                        updated_at: '2026-08-06T22:24:39.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          example: 41
                        placa:
                          type: string
                          example: NGZ0A00
                        chassi:
                          type: string
                          example: MIYVDLJNIKH000000
                        marca:
                          type: string
                          example: Chevrolet
                        modelo:
                          type: string
                          example: Kicks
                        versao:
                          type: string
                          example: '1.6 Turbo'
                        valor_venda:
                          type: string
                          example: '152854.40'
                        cor:
                          type: string
                          example: fuchsia
                        km:
                          type: integer
                          example: 208376
                        cambio:
                          type: string
                          example: manual
                        combustivel:
                          type: string
                          example: gasolina
                        user_id:
                          type: integer
                          example: 71
                        created_at:
                          type: string
                          example: '2026-08-06T22:24:39.000000Z'
                        updated_at:
                          type: string
                          example: '2026-08-06T22:24:39.000000Z'
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                        example: '/?page=1'
                      last:
                        type: string
                        example: '/?page=1'
                      prev:
                        type: string
                        example: null
                        nullable: true
                      next:
                        type: string
                        example: null
                        nullable: true
                  meta:
                    type: object
                    properties:
                      current_page:
                        type: integer
                        example: 1
                      from:
                        type: integer
                        example: 1
                      last_page:
                        type: integer
                        example: 1
                      links:
                        type: array
                        example:
                          - url: null
                            label: '&laquo; Previous'
                            page: null
                            active: false
                          - url: '/?page=1'
                            label: '1'
                            page: 1
                            active: true
                          - url: null
                            label: 'Next &raquo;'
                            page: null
                            active: false
                        items:
                          type: object
                          properties:
                            url:
                              type: string
                              example: null
                              nullable: true
                            label:
                              type: string
                              example: '&laquo; Previous'
                            page:
                              type: string
                              example: null
                              nullable: true
                            active:
                              type: boolean
                              example: false
                      path:
                        type: string
                        example: /
                      per_page:
                        type: integer
                        example: 15
                      to:
                        type: integer
                        example: 2
                      total:
                        type: integer
                        example: 2
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  type: 'about:blank'
                  title: Unauthorized
                  status: 401
                  detail: Unauthenticated.
                  instance: /api/vehicles
                properties:
                  type:
                    type: string
                    example: 'about:blank'
                  title:
                    type: string
                    example: Unauthorized
                  status:
                    type: integer
                    example: 401
                  detail:
                    type: string
                    example: Unauthenticated.
                  instance:
                    type: string
                    example: /api/vehicles
      tags:
        - Vehicles
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 16
                per_page:
                  type: integer
                  description: 'Must be at least 1.'
                  example: 22
                q:
                  type: string
                  description: ''
                  example: architecto
                marca:
                  type: string
                  description: ''
                  example: architecto
                modelo:
                  type: string
                  description: ''
                  example: architecto
                placa:
                  type: string
                  description: ''
                  example: architecto
                sort:
                  type: string
                  description: ''
                  example: architecto
    post:
      summary: 'Create a new vehicle owned by the authenticated user.'
      operationId: createANewVehicleOwnedByTheAuthenticatedUser
      description: "`user_id` is not part of `$request->validated()` — it is not\nvalidated input at all, it is assigned directly from the\nauthenticated user, so a client can never influence it by including\nit in the payload (`Vehicle::$fillable` also excludes it, as a second\nline of defense). `created_by`/`updated_by` are stamped separately by\n`VehicleObserver` on the `creating` event."
      parameters: []
      responses:
        201:
          description: 'Veículo criado. `images` vem vazio logo após a criação; `creator`/`updater` refletem o usuário autenticado.'
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    id: 43
                    placa: GZM0A02
                    chassi: IYVDLJNIKHW000002
                    marca: Ford
                    modelo: Cronos
                    versao: Comfortline
                    valor_venda: '54132.38'
                    cor: navy
                    km: 237248
                    cambio: manual
                    combustivel: gasolina
                    user_id: 73
                    created_at: '2026-08-06T22:24:39.000000Z'
                    updated_at: '2026-08-06T22:24:39.000000Z'
                    creator: null
                    updater: null
                    images:
                      -
                        id: 31
                        path: vehicles/258/f2726f3d-9044-3663-bede-2a0f37053879.jpg
                        url: 'http://localhost:8000/storage/vehicles/258/f2726f3d-9044-3663-bede-2a0f37053879.jpg'
                        is_cover: false
                        created_at: '2026-08-06T22:24:39.000000Z'
                        updated_at: '2026-08-06T22:24:39.000000Z'
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 43
                      placa:
                        type: string
                        example: GZM0A02
                      chassi:
                        type: string
                        example: IYVDLJNIKHW000002
                      marca:
                        type: string
                        example: Ford
                      modelo:
                        type: string
                        example: Cronos
                      versao:
                        type: string
                        example: Comfortline
                      valor_venda:
                        type: string
                        example: '54132.38'
                      cor:
                        type: string
                        example: navy
                      km:
                        type: integer
                        example: 237248
                      cambio:
                        type: string
                        example: manual
                      combustivel:
                        type: string
                        example: gasolina
                      user_id:
                        type: integer
                        example: 73
                      created_at:
                        type: string
                        example: '2026-08-06T22:24:39.000000Z'
                      updated_at:
                        type: string
                        example: '2026-08-06T22:24:39.000000Z'
                      creator:
                        type: string
                        example: null
                        nullable: true
                      updater:
                        type: string
                        example: null
                        nullable: true
                      images:
                        type: array
                        example:
                          - id: 31
                            path: vehicles/258/f2726f3d-9044-3663-bede-2a0f37053879.jpg
                            url: 'http://localhost:8000/storage/vehicles/258/f2726f3d-9044-3663-bede-2a0f37053879.jpg'
                            is_cover: false
                            created_at: '2026-08-06T22:24:39.000000Z'
                            updated_at: '2026-08-06T22:24:39.000000Z'
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 31
                            path:
                              type: string
                              example: vehicles/258/f2726f3d-9044-3663-bede-2a0f37053879.jpg
                            url:
                              type: string
                              example: 'http://localhost:8000/storage/vehicles/258/f2726f3d-9044-3663-bede-2a0f37053879.jpg'
                            is_cover:
                              type: boolean
                              example: false
                            created_at:
                              type: string
                              example: '2026-08-06T22:24:39.000000Z'
