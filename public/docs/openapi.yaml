                    example: 'about:blank'
                  title:
                    type: string
                    example: 'Not Found'
                  status:
                    type: integer
                    example: 404
                  detail:
                    type: string
                    example: 'The requested resource was not found.'
                  instance:
                    type: string
                    example: /api/vehicles/1/images/999
      tags:
        - Images
    parameters:
      -
        in: path
        name: vehicle_id
        description: 'Id do veículo.'
        example: 1
        required: true
        schema:
          type: integer
      -
        in: path
        name: imageId
        description: 'Id da imagem (deve pertencer ao veículo informado).'
        example: 1
        required: true
        schema:
          type: integer
