    httpMethods:
      - DELETE
    uri: 'api/vehicles/{vehicle_id}'
    metadata:
      custom: []
      groupName: Vehicles
      groupDescription: 'CRUD de veículos. Qualquer usuário autenticado pode listar/visualizar qualquer veículo; apenas o dono (`user_id`) ou um usuário `is_admin` pode atualizar ou excluir.'
      subgroup: ''
      subgroupDescription: ''
      title: 'Delete a vehicle.'
      description: |-
        `vehicle_images.vehicle_id` is `cascadeOnDelete()` at the raw
        PostgreSQL level, so `VehicleImage` rows disappear automatically along
        with the vehicle — but that cascade never fires an Eloquent event, so
        `VehicleImageService::deleteAllForVehicle()` is called, inside the same
        transaction, to also clean up the physical files from the public disk
        (deferred to after the commit, so a rollback never leaves the vehicle
        gone but its images' files still on disk, or vice versa).
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      vehicle_id:
        custom: []
        name: vehicle_id
        description: 'Id do veículo.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
