    custom: []
    httpMethods:
      - POST
    uri: 'api/vehicles/{vehicle_id}/images'
    metadata:
      custom: []
      groupName: Images
      groupDescription: 'Upload e gestão de imagens de um veículo, incluindo a capa única (`is_cover`). Assim como `update`/`delete` de veículos, apenas o dono do veículo ou um usuário `is_admin` pode gerenciar suas imagens.'
      subgroup: ''
      subgroupDescription: ''
      title: 'Enviar uma ou mais imagens para um veículo'
      description: |-
        `VehiclePolicy::manageImages` restringe isto do mesmo jeito que `update`/`delete` já
        restringem suas próprias ações: só o dono do veículo ou um usuário `is_admin` pode
        adicionar imagens a ele.
      authenticated: true
      deprecated: false
    headers:
      Content-Type: multipart/form-data
      Accept: application/json
    urlParameters:
      vehicle_id:
        custom: []
        name: vehicle_id
        description: 'Id do veículo.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      vehicle_id: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      files:
        custom: []
        name: files
        description: 'Um ou mais arquivos de imagem (jpeg, jpg, png, gif ou webp; até 2MB cada). Enviado como multipart/form-data.'
        required: true
        example:
          - null
        type: 'file[]'
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanBodyParameters: []
    fileParameters:
      files:
        - null
    responses:
      -
        custom: []
        status: 201
        content: '{"data":[{"id":58,"path":"vehicles\/169\/a4855dc5-0acb-33c3-b921-f4291f719ca0.jpg","url":"http:\/\/localhost:8000\/storage\/vehicles\/169\/a4855dc5-0acb-33c3-b921-f4291f719ca0.jpg","is_cover":false,"created_at":"2026-08-07T01:44:53.000000Z","updated_at":"2026-08-07T01:44:53.000000Z"},{"id":59,"path":"vehicles\/247\/d98239dc-1582-3bf2-b93a-df3a18e121d1.jpg","url":"http:\/\/localhost:8000\/storage\/vehicles\/247\/d98239dc-1582-3bf2-b93a-df3a18e121d1.jpg","is_cover":false,"created_at":"2026-08-07T01:44:53.000000Z","updated_at":"2026-08-07T01:44:53.000000Z"}]}'
        headers: []
        description: 'Imagens criadas. A primeira imagem já enviada para um veículo é automaticamente marcada como `is_cover`.'
      -
        custom: []
        status: 403
        content: '{"type":"about:blank","title":"Forbidden","status":403,"detail":"This action is unauthorized.","instance":"\/api\/vehicles\/1\/images"}'
        headers: []
