        headers: []
        description: 'Imagem promovida a capa. Qualquer imagem anteriormente marcada como capa deste veículo deixa de sê-lo, de forma transacional.'
      -
        custom: []
        status: 403
        content: '{"type":"about:blank","title":"Forbidden","status":403,"detail":"This action is unauthorized.","instance":"\/api\/vehicles\/1\/images\/1\/cover"}'
        headers: []
        description: ''
      -
