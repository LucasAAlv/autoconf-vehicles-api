        headers: []
        description: 'Também retornado quando a imagem existe mas pertence a outro veículo.'
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
  -
    custom: []
    httpMethods:
      - DELETE
    uri: 'api/vehicles/{vehicle_id}/images/{imageId}'
    metadata:
      custom: []
      groupName: Images
      groupDescription: 'Upload e gestão de imagens de um veículo, incluindo a capa única (`is_cover`). Assim como `update`/`delete` de veículos, apenas o dono do veículo ou um usuário `is_admin` pode gerenciar suas imagens.'
      subgroup: ''
      subgroupDescription: ''
      title: 'Excluir uma imagem de um veículo'
      description: |-
        A imagem é buscada através de `$vehicle->images()` em vez de um `VehicleImage::findOrFail()`
        global (ou binding implícito de rota em `{imageId}`): isso garante que uma imagem
        pertencente a outro veículo retorne 404 exatamente como uma que não existe, em vez de
        vazar um 403 (ou ter sucesso) para um id que é real mas não é "deste veículo".
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      vehicle_id:
        custom: []
        name: vehicle_id
        description: 'Id do veículo.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      imageId:
        custom: []
        name: imageId
        description: 'Id da imagem (deve pertencer ao veículo informado).'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      vehicle_id: 1
      imageId: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
    responses:
