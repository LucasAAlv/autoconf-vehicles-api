  -
    custom: []
    httpMethods:
      - PATCH
    uri: 'api/vehicles/{vehicle_id}/images/{imageId}/cover'
    metadata:
      custom: []
      groupName: Images
      groupDescription: 'Upload e gestão de imagens de um veículo, incluindo a capa única (`is_cover`). Assim como `update`/`delete` de veículos, apenas o dono do veículo ou um usuário `is_admin` pode gerenciar suas imagens.'
      subgroup: ''
      subgroupDescription: ''
      title: 'Definir a capa de um veículo'
      description: |-
        `{imageId}` é resolvido manualmente (query com escopo por `vehicle_id` + `findOrFail`)
        em vez de nested route-model binding implícito: o binding aninhado precisaria que
        `{vehicle}` e `{image}` estivessem relacionados por um relationship Eloquent nomeado
        batendo com o segmento da rota, enquanto aqui o que interessa de verdade é justamente
        checar que a imagem pertence a este veículo (uma imagem de outro veículo deve retornar
        404, não 403), então isso fica explícito. `findOrFail` lança `ModelNotFoundException`,
        que o exception handler em `bootstrap/app.php` já reescreve como 404
        `application/problem+json` — nada extra é necessário aqui, seja pra "veículo errado"
        ou "imagem inexistente".
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters:
      vehicle_id:
        custom: []
        name: vehicle_id
        description: 'Id do veículo.'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
      imageId:
        custom: []
        name: imageId
        description: 'Id da imagem (deve pertencer ao veículo informado).'
        required: true
        example: 1
        type: integer
        enumValues: []
        exampleWasSpecified: false
        nullable: false
        deprecated: false
    cleanUrlParameters:
      vehicle_id: 1
      imageId: 1
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters: []
    cleanBodyParameters: []
    fileParameters: []
